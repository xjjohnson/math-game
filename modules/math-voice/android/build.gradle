plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.xjjohnson.mathgame'
version = '0.1.0'

android {
  namespace "expo.modules.mathvoice"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  // The voice models are already compressed; don't squeeze them again.
  androidResources {
    noCompress += ['onnx']
  }
}

dependencies {
  // sherpa-onnx (offline neural speech). The Android workflow downloads the
  // release .aar, then puts its classes in libs/sherpa-onnx.jar and its native
  // .so files in src/main/jniLibs/ (a library module can't depend on a local
  // .aar). None of it is kept in git.
  implementation fileTree(dir: 'libs', include: ['*.jar'])
}

# Ships each merge to main to the phones, one of two ways:
# - Only the JavaScript changed: publish it over the air with EAS Update. The
#   app downloads it by itself; no new APK, no 30 minute build.
# - Native code changed (new native library, Nearby module, permissions, Expo
#   upgrade), or there's no EXPO_TOKEN secret: build the APK and post it on the
#   "Latest Android app" release, where the app's Update now button finds it.
# Running it by hand from the Actions tab ("Run workflow") always builds the APK.
name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck and tests
        run: |
          npm run typecheck
          npm test -- --ci

      # The runtime version is a fingerprint of the native side of the app.
      # The released APK records its own in version.json; when this commit's
      # matches, an over-the-air update fits the phones as they are.
      - name: Decide between an over-the-air update and a new APK
        id: plan
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EVENT: ${{ github.event_name }}
        run: |
          field() { node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s)[process.argv[1]]??"")}catch{console.log("")}})' "$1"; }
          runtime=$(npx expo-updates runtimeversion:resolve --platform android | field runtimeVersion)
          released=$(curl -fsSL "https://github.com/${GITHUB_REPOSITORY}/releases/download/latest-apk/version.json" || echo '{}')
          released_runtime=$(echo "$released" | field runtime)
          released_build=$(echo "$released" | field build)
          echo "This commit: runtime $runtime. Released APK: build ${released_build:-none}, runtime ${released_runtime:-none}."
          if [ -z "$runtime" ]; then
            echo "Couldn't work out the runtime version." >&2
            exit 1
          fi
          if [ "$EVENT" = "push" ] && [ -n "$EXPO_TOKEN" ] && [ -n "$released_build" ] && [ "$runtime" = "$released_runtime" ]; then
            mode=ota
          else
            mode=apk
          fi
          echo "Shipping as: $mode"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "runtime=$runtime" >> "$GITHUB_OUTPUT"
          echo "released_build=$released_build" >> "$GITHUB_OUTPUT"

      # The update keeps the installed APK's build number, so Update now still
      # compares against the APK that's actually on the phone.
      - name: Publish over the air
        if: steps.plan.outputs.mode == 'ota'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_BUILD_NUMBER: ${{ steps.plan.outputs.released_build }}
          EXPO_NO_TELEMETRY: 1
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          npx -y eas-cli@26 update --channel production --environment production \
            --platform android --non-interactive \
            --message "$(echo "$MESSAGE" | head -n 1 | cut -c1-200)"

      - uses: actions/setup-java@v4
        if: steps.plan.outputs.mode == 'apk'
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        if: steps.plan.outputs.mode == 'apk'

      # Story Voice: the sherpa-onnx library and two natural Piper voices
      # (hfc female and male, medium). About 120 MB, so they're fetched here
      # instead of kept in git. A failed download stops the build, so the
      # phones keep the last good APK.
      # Android refuses to build a library module (math-voice) that depends on
      # a local .aar, so the .aar is opened up here: its classes become a .jar
      # in libs/ and its native .so files go in src/main/jniLibs/.
      - name: Download Story Voice
        if: steps.plan.outputs.mode == 'apk'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mod=modules/math-voice/android
          mkdir -p "$mod/libs" "$mod/src/main/jniLibs" "$mod/src/main/assets/voices"
          # Pinned: version 2.x stopped reading these Piper voices (it makes no
          # sound, then the app crashes), 1.12.40 is the one tested with them.
          aar="https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.12.40/sherpa-onnx-1.12.40.aar"
          echo "sherpa-onnx library: $aar"
          curl -fsSL -o /tmp/sherpa-onnx.aar "$aar"
          rm -rf /tmp/sherpa-aar && mkdir /tmp/sherpa-aar
          unzip -q /tmp/sherpa-onnx.aar -d /tmp/sherpa-aar
          cp /tmp/sherpa-aar/classes.jar "$mod/libs/sherpa-onnx.jar"
          cp -r /tmp/sherpa-aar/jni/* "$mod/src/main/jniLibs/"
          find "$mod/src/main/jniLibs" -name '*.so'
          for voice in hfc_female hfc_male; do
            dir=vits-piper-en_US-$voice-medium
            curl -fsSL "https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/$dir.tar.bz2" | tar xj -C /tmp
            mkdir -p "$mod/src/main/assets/voices/$voice"
            cp /tmp/$dir/*.onnx "$mod/src/main/assets/voices/$voice/model.onnx"
            cp /tmp/$dir/tokens.txt "$mod/src/main/assets/voices/$voice/"
            if [ ! -d "$mod/src/main/assets/voices/espeak-ng-data" ]; then
              cp -r /tmp/$dir/espeak-ng-data "$mod/src/main/assets/voices/"
            fi
            # Keep the voice's license next to it.
            cp /tmp/$dir/MODEL_CARD "$mod/src/main/assets/voices/$voice/" 2>/dev/null || true
            echo "--- $voice license ---"; grep -i -A3 license /tmp/$dir/MODEL_CARD || true
          done
          du -sh "$mod/libs" "$mod/src/main/jniLibs" "$mod/src/main/assets/voices"/*

      - name: Generate the Android project
        if: steps.plan.outputs.mode == 'apk'
        run: npx expo prebuild --platform android --no-install
        env:
          EXPO_NO_TELEMETRY: 1

      # Release builds shrink the app's code (R8). The sherpa-onnx native
      # library looks up its Kotlin classes and fields by name, so shrinking
      # them made it abort ("fid == null") when loading a voice. Keep them.
      - name: Keep the Story Voice library from being shrunk
        if: steps.plan.outputs.mode == 'apk'
        run: |
          printf '\n-keep class com.k2fsa.sherpa.onnx.** { *; }\n-keepclasseswithmembernames class * { native <methods>; }\n' >> android/app/proguard-rules.pro
          tail -5 android/app/proguard-rules.pro

      # The app compares this number with version.json on the release to offer
      # updates. The fingerprint override bakes in exactly the runtime version
      # written to version.json, so later over-the-air updates match it.
      - name: Build the APK
        if: steps.plan.outputs.mode == 'apk'
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
        env:
          EXPO_PUBLIC_BUILD_NUMBER: ${{ github.run_number }}
          EXPO_UPDATES_FINGERPRINT_OVERRIDE: ${{ steps.plan.outputs.runtime }}

      - name: Name the APK and write its version
        if: steps.plan.outputs.mode == 'apk'
        env:
          RUNTIME: ${{ steps.plan.outputs.runtime }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk math-game.apk
          echo "{\"build\": ${{ github.run_number }}, \"sha\": \"${GITHUB_SHA::7}\", \"runtime\": \"$RUNTIME\"}" > version.json

      - uses: actions/upload-artifact@v4
        if: steps.plan.outputs.mode == 'apk'
        with:
          name: math-game-apk
          path: math-game.apk

      - name: Post it on the "Latest Android app" release
        if: steps.plan.outputs.mode == 'apk'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-apk --yes --cleanup-tag || true
          gh release create latest-apk math-game.apk version.json \
            --target "$GITHUB_SHA" \
            --title "Latest Android app" \
            --notes "Build ${{ github.run_number }}, from ${GITHUB_REF_NAME} at ${GITHUB_SHA::7}. To install, open this page on the phone, tap math-game.apk, and allow installing from your browser when asked. Once installed, the app offers new versions itself on its Home screen. Smaller changes arrive over the air without a new APK."

# Builds the Android app and posts it as a download on the "Latest Android app"
# release, so phones can install it straight from GitHub. Runs on every merge
# to main, or by hand from the Actions tab ("Run workflow").
name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      - name: Typecheck and tests
        run: |
          npm run typecheck
          npm test -- --ci

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install
        env:
          EXPO_NO_TELEMETRY: 1

      # The app compares this number with version.json on the release to offer updates.
      - name: Build the APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
        env:
          EXPO_PUBLIC_BUILD_NUMBER: ${{ github.run_number }}

      - name: Name the APK and write its version
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk math-game.apk
          echo "{\"build\": ${{ github.run_number }}, \"sha\": \"${GITHUB_SHA::7}\"}" > version.json

      - uses: actions/upload-artifact@v4
        with:
          name: math-game-apk
          path: math-game.apk

      - name: Post it on the "Latest Android app" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-apk --yes --cleanup-tag || true
          gh release create latest-apk math-game.apk version.json \
            --target "$GITHUB_SHA" \
            --title "Latest Android app" \
            --notes "Build ${{ github.run_number }}, from ${GITHUB_REF_NAME} at ${GITHUB_SHA::7}. To install, open this page on the phone, tap math-game.apk, and allow installing from your browser when asked. Once installed, the app offers new versions itself on its Home screen."
